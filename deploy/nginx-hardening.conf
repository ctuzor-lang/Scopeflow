# ScopeFlow: server-wide nginx settings (installed to /etc/nginx/conf.d/). Security review F10.
server_tokens off;

# General request rate per visitor, and a tighter one for form posts (sign-in, server actions).
limit_req_zone $binary_remote_addr zone=sf_all:10m rate=20r/s;
map $request_method $sf_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $sf_post_key zone=sf_post:10m rate=2r/s;
limit_req_status 429;

# HTTPS requests for any name we don't serve (e.g. the bare IP address) are refused outright.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
