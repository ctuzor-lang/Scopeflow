# ScopeFlow behind nginx. setup.sh replaces __DOMAIN__ and __PORT__.
# certbot adds the HTTPS server block and the HTTP→HTTPS redirect.

# Requests for any other name (e.g. the bare IP address) get nothing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Logos are capped at 512 KB and scope imports at 5 MB.
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        limit_req zone=sf_all burst=60 nodelay;
        limit_req zone=sf_post burst=20 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        # Set these here, overwriting anything the visitor sent: the app trusts them (TRUST_PROXY=true).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
